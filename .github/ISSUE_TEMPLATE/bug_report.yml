name: Bug Report
description: File a bug report or issue with my-pi
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: my-pi version
      description: What version of my-pi are you using? (e.g., 0.1.0-alpha.1)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System & Node Version
      description: e.g., Windows 11 / Ubuntu 24.04 / macOS 15, Node.js v22.6.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please describe the steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant terminal or MCP client logs.
      render: shell