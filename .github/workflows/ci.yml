name: My-Pi Multi-Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-matrix:
    name: quality (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22 # compatibility lane

    env:
      CI: "true"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.2.2
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable at 2026-09-04
        with:
          toolchain: stable

      - name: Runner diagnostics
        run: |
          node --version
          pnpm --version
          cargo --version
          git --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check public repository boundary
        run: node scripts/check-public-boundary.mjs

      - name: Native Rust workspace check
        run: cargo check --workspace

      - name: Project-reference validation (R0.1.1)
        run: node scripts/check-project-references.mjs

      - name: Architecture boundary check (R0.1.8)
        run: node scripts/architecture-check.mjs

      - name: TypeScript build
        run: pnpm build

      - name: Unit + Integration tests (100+ suites)
        run: pnpm test

      - name: Bind release evidence to current commit
        run: node scripts/bind-release-evidence.mjs

      - name: Release verifier test suite
        run: node --test test/release/**/*.test.mjs

      - name: Gate evidence validation (R0.1.10)
        run: node scripts/verify-gates.mjs

      - name: Release admission gate verification
        run: node scripts/verify-release.mjs

      - name: Host probe & era negotiation (R0.1.7)
        run: node scripts/probe-hosts.mjs

      - name: PR smoke test (pack + tarball + my-pi-mcp stdio)
        run: node scripts/pr-smoke.mjs

      - name: Secret scan
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Supply-chain - pnpm audit
        run: pnpm audit --prod

      - name: Supply-chain - cargo audit & deny (ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo audit
          cargo deny check licenses advisories bans sources

      - name: Supply-chain - SBOM generation & verification
        run: |
          node scripts/generate-sbom.mjs
          node scripts/verify-sbom.mjs

      - name: Benchmark smoke - stdio overhead & traversal
        run: |
          node benchmarks/stdio-overhead.mjs 50
          node benchmarks/traversal-benchmark.mjs --profile smoke

      - name: Runtime boundary evidence (spawned MCP server)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node benchmarks/runtime-boundaries.mjs
