name: CCR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [24]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # Diagnostic first so any failure has useful context.
      - name: Runner diagnostics
        run: |
          node --version || true
          git --version
          pwd

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Environment
        run: |
          node --version
          pnpm --version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build + typecheck
        run: pnpm build

      - name: Unit + integration tests
        run: pnpm test

      - name: Architecture boundary check
        run: node scripts/architecture-check.mjs

      - name: Stdio subprocess integration tests
        run: node --experimental-strip-types --test packages/mcp-adapter/test/stdio-subprocess.test.ts

      - name: VCS tests (git required)
        run: node --experimental-strip-types --test packages/vcs/test/vcs.test.ts
