name: CCR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build + typecheck
        run: npx tsc --build
      - name: Unit + integration tests
        run: node --experimental-strip-types --test "packages/*/test/*.test.ts"
      - name: Stdio subprocess integration tests
        run: node --experimental-strip-types --test "packages/mcp-adapter/test/stdio-subprocess.test.ts"
      - name: Architecture boundary check (mcp-adapter must not own fs/vcs business logic)
        run: node scripts/architecture-check.mjs
      - name: VCS tests (git required)
        run: node --experimental-strip-types --test "packages/vcs/test/vcs.test.ts"
