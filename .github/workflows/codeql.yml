name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis (javascript-typescript)
    runs-on: ubuntu-latest
    continue-on-error: true  # Code Scanning must be enabled in repo Settings > Security. Non-blocking until enabled.
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results

      - name: Upload SARIF report artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-results
          path: sarif-results
          retention-days: 14

      - name: Upload SARIF to GitHub Security Tab (optional)
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: sarif-results