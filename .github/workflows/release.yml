name: Release Qualification & Publishing

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel (alpha, beta, rc, stable)"
        required: true
        default: "alpha"
      publish:
        description: "Publish admitted candidate to npm and Official MCP Registry"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: build-and-pack-release-candidate
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_QUALIFICATION: "true"
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      artifact_sha256: ${{ steps.pack.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.2.2
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable at 2026-09-04
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check requested release channel
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel || 'alpha' }}
        run: node -e "const policy=require('./release/release-policy.json'); if(process.env.RELEASE_CHANNEL !== policy.releaseChannel) throw new Error('Requested channel does not match the package release policy'); console.log('Release channel:', policy.releaseChannel)"

      - name: Check public repository boundary
        run: node scripts/check-public-boundary.mjs

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Project references & architecture check
        run: |
          node scripts/check-project-references.mjs
          node scripts/architecture-check.mjs

      - name: Build with lockfile-controlled toolchain
        run: pnpm build

      - name: Unit & integration tests
        run: pnpm test

      - name: Bind evidence to this candidate
        run: node scripts/bind-release-evidence.mjs

      - name: Release verifier test suite
        run: pnpm test:release

      - name: Pack the sole release TGZ
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          pnpm --filter @koonwang03/my-pi pack --pack-destination dist-release
          mapfile -t artifacts < <(find dist-release -maxdepth 1 -type f -name '*.tgz' -printf '%f\n')
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "Expected exactly one release TGZ, found ${#artifacts[@]}" >&2
            exit 1
          fi
          echo "artifact_name=${artifacts[0]}" >> "$GITHUB_OUTPUT"
          sha256sum "dist-release/${artifacts[0]}" | awk '{print "artifact_sha256="$1}' >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact packed TGZ
        run: node scripts/pr-smoke.mjs --artifact "dist-release/${{ steps.pack.outputs.artifact_name }}"

      - name: Upload the candidate TGZ for qualification lanes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-tgz
          path: dist-release/${{ steps.pack.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 1

  qualify:
    name: release-qualification (${{ matrix.os }}, node ${{ matrix.node }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_QUALIFICATION: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.2.2
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable at 2026-09-04
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public repository boundary
        run: node scripts/check-public-boundary.mjs

      - name: Native Rust workspace check
        run: cargo check --workspace

      - name: Project references & architecture check
        run: |
          node scripts/check-project-references.mjs
          node scripts/architecture-check.mjs

      - name: Build with lockfile-controlled toolchain
        run: pnpm build

      - name: Unit & integration tests
        run: pnpm test

      - name: Bind evidence to this candidate
        run: node scripts/bind-release-evidence.mjs

      - name: Release verifier test suite
        run: pnpm test:release

      - name: Verify evidence consistency
        run: node scripts/verify-gates.mjs --strict

      - name: Verify standard release contracts
        run: node scripts/verify-release.mjs

      - name: Download the sole release TGZ
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-tgz
          path: dist-release

      - name: Clean-install the exact release TGZ
        run: node scripts/pr-smoke.mjs --artifact "dist-release/${{ needs.prepare.outputs.artifact_name }}"

  admit:
    name: strict-release-admission
    needs: [prepare, qualify]
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.2.2
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable at 2026-09-04
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the sole release TGZ
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-tgz
          path: dist-release

      - name: Verify artifact bytes were preserved across qualification
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "dist-release/${{ needs.prepare.outputs.artifact_name }}" | awk '{print $1}')"
          test "$actual" = "${{ needs.prepare.outputs.artifact_sha256 }}"
          echo "Exact artifact SHA256: $actual"

      - name: Clean-install smoke on the checksum candidate
        run: node scripts/pr-smoke.mjs --artifact "dist-release/${{ needs.prepare.outputs.artifact_name }}"

      - name: Build source runtime for release benchmark
        run: pnpm build

      - name: Release traversal benchmark (100k minimum)
        run: node benchmarks/traversal-benchmark.mjs --profile release

      - name: Runtime boundary evidence (spawned MCP server)
        run: node benchmarks/runtime-boundaries.mjs

      - name: Supply-chain - pnpm audit (fail-closed)
        run: pnpm audit --prod

      - name: Supply-chain - cargo audit & deny (fail-closed)
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo audit
          cargo deny check licenses advisories bans sources

      - name: Generate and validate candidate SBOM
        run: |
          node scripts/generate-sbom.mjs
          node scripts/verify-sbom.mjs

      - name: Bind and verify candidate evidence
        run: |
          node scripts/bind-release-evidence.mjs
          node scripts/verify-gates.mjs --strict
          node scripts/verify-release.mjs --strict

      - name: Checksum the exact tested artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          sha256sum "${{ needs.prepare.outputs.artifact_name }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate and validate release manifest
        run: node scripts/create-release-manifest.mjs --artifact "dist-release/${{ needs.prepare.outputs.artifact_name }}" --sbom provenance/SBOM.cdx.json --benchmark benchmarks/results/traversal-release.json --output "dist-release/release-manifest.json"

      - name: Upload exact artifact and qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            dist-release/${{ needs.prepare.outputs.artifact_name }}
            dist-release/SHA256SUMS.txt
            dist-release/release-manifest.json
            provenance/SBOM.cdx.json
            benchmarks/results/traversal-release.json
            benchmarks/results/runtime-boundaries.json
            evidence/*.json
            docs/release/*
          if-no-files-found: error

  publish:
    name: publish-npm-registry-and-github-release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main' }}
    needs: [prepare, qualify, admit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_LINUX_AMD64_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download strictly admitted release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: admitted-release

      - name: Resolve admitted artifact and release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release/release-policy.json').version")"
          PACKAGE_NAME="$(node -p "require('./release/release-policy.json').packageName")"
          SERVER_NAME="$(node -p "require('./server.json').name")"
          mapfile -t tgz_files < <(find admitted-release -type f -name '*.tgz' -print)
          mapfile -t checksum_files < <(find admitted-release -type f -name 'SHA256SUMS.txt' -print)
          mapfile -t manifest_files < <(find admitted-release -type f -name 'release-manifest.json' -print)
          test "${#tgz_files[@]}" -eq 1
          test "${#checksum_files[@]}" -eq 1
          test "${#manifest_files[@]}" -eq 1
          TGZ="${tgz_files[0]}"
          CHECKSUMS="${checksum_files[0]}"
          RELEASE_MANIFEST="${manifest_files[0]}"
          expected_sha="$(awk 'NF >= 1 {print $1; exit}' "$CHECKSUMS")"
          actual_sha="$(sha256sum "$TGZ" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          node -e "const p=require('./release/release-policy.json'); const s=require('./server.json'); const a=require('./apps/my-pi-mcp/package.json'); if(p.version!==s.version||p.version!==a.version||p.packageName!==a.name||s.name!==a.mcpName) throw new Error('Release identity mismatch before publication')"
          node scripts/verify-publish-artifact.mjs \
            --artifact "$TGZ" \
            --checksums "$CHECKSUMS" \
            --manifest "$RELEASE_MANIFEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "server_name=$SERVER_NAME" >> "$GITHUB_OUTPUT"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "checksums=$CHECKSUMS" >> "$GITHUB_OUTPUT"
          echo "release_manifest=$RELEASE_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install and verify pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate Official MCP Registry manifest before npm publication
        run: ./mcp-publisher validate server.json

      - name: Install npm CLI with trusted-publishing support
        run: npm install --global npm@11.19.1

      - name: Publish npm package with GitHub OIDC when absent
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          PACKAGE_NAME: ${{ steps.identity.outputs.package_name }}
          TGZ: ${{ steps.identity.outputs.tgz }}
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$VERSION" version --json >/tmp/npm-version.json 2>/dev/null; then
            observed="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/npm-version.json','utf8'))")"
            test "$observed" = "$VERSION"
            observed_mcp_name="$(npm view "$PACKAGE_NAME@$VERSION" mcpName)"
            test "$observed_mcp_name" = "io.github.BoxBoxmari/my-pi"
            echo "npm $PACKAGE_NAME@$VERSION already exists with expected MCP identity; skipping duplicate publish."
          else
            npm publish "$TGZ" --access public
          fi

      - name: Verify npm package metadata after publication
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          PACKAGE_NAME: ${{ steps.identity.outputs.package_name }}
        run: |
          set -euo pipefail
          test "$(npm view "$PACKAGE_NAME@$VERSION" version)" = "$VERSION"
          test "$(npm view "$PACKAGE_NAME@$VERSION" mcpName)" = "io.github.BoxBoxmari/my-pi"

      - name: Publish Official MCP Registry entry with GitHub OIDC when absent
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SERVER_NAME: ${{ steps.identity.outputs.server_name }}
        run: |
          set -euo pipefail
          encoded_name="${SERVER_NAME//\//%2F}"
          registry_url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/${VERSION}"
          if curl --fail --silent --show-error "$registry_url" >/tmp/registry-entry.json 2>/dev/null; then
            echo "Official MCP Registry already contains $SERVER_NAME@$VERSION; skipping duplicate publish."
          else
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish server.json
          fi
          curl --fail --silent --show-error "$registry_url" >/tmp/registry-entry.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/registry-entry.json','utf8')); const s=d.server || d; const expected=JSON.parse(fs.readFileSync('server.json','utf8')); const packages=Array.isArray(s.packages)?s.packages.filter(p=>p?.registryType==='npm'):[]; const expectedPackage=expected.packages?.find(p=>p?.registryType==='npm'); if(s.name !== process.env.SERVER_NAME || s.version !== process.env.VERSION || packages.length !== 1 || !expectedPackage || packages[0].identifier !== expectedPackage.identifier || packages[0].version !== expectedPackage.version) throw new Error('Registry verification mismatch'); console.log('Verified registry entry:', s.name, s.version, packages[0].identifier, packages[0].version)"

      - name: Create release tag and GitHub prerelease when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          TGZ: ${{ steps.identity.outputs.tgz }}
          CHECKSUMS: ${{ steps.identity.outputs.checksums }}
          RELEASE_MANIFEST: ${{ steps.identity.outputs.release_manifest }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            test "$tag_commit" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping duplicate creation."
          else
            gh release create "$TAG" "$TGZ" "$CHECKSUMS" "$RELEASE_MANIFEST" \
              --title "my-pi $TAG" \
              --generate-notes \
              --prerelease
          fi