name: Release Qualification & Publishing

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel (alpha, beta, rc, stable)"
        required: true
        default: "alpha"

permissions:
  contents: read

jobs:
  qualify:
    name: release-qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public repository boundary
        run: node scripts/check-public-boundary.mjs

      - name: Project references & architecture check
        run: |
          node scripts/check-project-references.mjs
          node scripts/architecture-check.mjs

      - name: TypeScript build & standalone bundle
        run: pnpm build

      - name: Unit & Integration tests
        run: pnpm test

      - name: Release verifier test suite
        run: node --test test/release/**/*.test.mjs

      - name: True clean-install package smoke
        run: node scripts/pr-smoke.mjs

      - name: 100k Release Traversal Benchmark (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: node benchmarks/traversal-benchmark.mjs --profile release

      - name: Supply-chain - pnpm audit (fail-closed)
        run: pnpm audit --prod

      - name: Supply-chain - cargo audit & deny (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit cargo-deny --locked
          cargo audit
          cargo deny check licenses advisories bans sources

      - name: Generate SBOM
        run: |
          node scripts/generate-sbom.mjs
          node -e "import('node:fs/promises').then(fs => fs.access('provenance/SBOM.cdx.json'))"

      - name: Release admission gate verification
        run: node scripts/verify-release.mjs

      - name: Pack release tarball
        run: |
          mkdir -p dist-release
          pnpm --filter my-pi pack --pack-destination dist-release

      - name: Generate Checksums
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist-release
          sha256sum *.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist-release/*
            provenance/SBOM.cdx.json
            docs/release/*